project:
  type: website
  execute-dir: project
  resources:
    - "files/"
    - "projects/"
    - "pdf_slides/"
    - "slides/*.pdf"
  preview:
    port: 27514
  render:
    - "*.qmd"
    - "!staging/"
    - "!projects/"
    - "!pdf_slides/"

filters:
  - line-highlight
  - include-code-files

## Freeze seems to interact badly with the schedule.qmd / schedule.csv relation
execute:
  freeze: auto # Re-render only when source changes

bibliography: files/bib/mptc_references.bib
link-citations: false
csl: files/bib/chicago-syllabus-no-bib.csl
description-meta: "A seminar about the tools you'll use every day but no-one teaches."

website:
  title: "Modern Plain Text Computing"
  site-url: "https://mptc.io"
  repo-url: "https://github.com/kjhealy/mptc"
  navbar:
    pinned: true
    right:
      - text: "Schedule"
        file: schedule/index.qmd
      - text: "Content"
        file: content/index.qmd
      - text: "Examples"
        file: example/index.qmd
      - text: "Assignments"
        file: assignment/index.qmd
  sidebar:
    - title: "Content"
      style: "docked"
      search: false
      background: dark
      contents:
        - section: "Overview"
          contents:
            - content/index.qmd
        - section: "Topics"
          contents:
            - text: "01: Doing Your Work Properly"
              file: content/01-content-doing-your-work.qmd
            - text: "02: The File System and the Shell"
              file: "content/02-content-file-system-and-shell.qmd"
            - text: "03: Using R to look at data"
              file: "content/03-content-r-and-ggplot.qmd"
            # Weeks not yet written. An entry here for a file that doesn't exist
            # renders as a broken sidebar link, so each stays commented out until
            # its page lands. (The schedule page greys its icons out by itself --
            # see schedule_icon() in R/tar_calendar.R -- but a Quarto sidebar
            # can't be conditional.)
